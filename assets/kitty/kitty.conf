# Catppuccin Mocha colours on neutral black, dark grey accent to match QogirBlack

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0


shell                   @HOME@/.local/bin/fish
background_opacity      0.92
window_padding_width    10
confirm_os_window_close 0
enable_audio_bell       no
cursor_shape            beam
tab_bar_style           powerline
tab_powerline_style     slanted

foreground            #d4d4d4
background            #0c0c0c
selection_foreground  #e4e4e4
selection_background  #505050
cursor                #bdbdbd
cursor_text_color     #0c0c0c
url_color             #bdbdbd

active_border_color     #808080
inactive_border_color   #2a2a2a
active_tab_foreground   #e4e4e4
active_tab_background   #505050
inactive_tab_foreground #9a9a9a
inactive_tab_background #1a1a1a
tab_bar_background      #0c0c0c

# black
color0  #262626
color8  #4a4a4a
# red
color1  #f38ba8
color9  #f38ba8
# green
color2  #a6e3a1
color10 #a6e3a1
# yellow
color3  #f9e2af
color11 #f9e2af
# blue
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #f5c2e7
color13 #f5c2e7
# cyan
color6  #94e2d5
color14 #94e2d5
# white
color7  #bdbdbd
color15 #e4e4e4

# Tabs and windows, Konsole style. New ones start in the current directory.
tab_bar_edge          top
enabled_layouts       splits,stack
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+n      new_os_window_with_cwd
map ctrl+shift+d      launch --type=tab --cwd=current --copy-env
map ctrl+shift+w      close_tab
map ctrl+tab          next_tab
map ctrl+shift+tab    previous_tab
map ctrl+shift+e      launch --location=vsplit --cwd=current
map ctrl+shift+o      launch --location=hsplit --cwd=current
map ctrl+shift+x      close_window
map ctrl+shift+z      toggle_layout stack
map ctrl+alt+left     neighboring_window left
map ctrl+alt+right    neighboring_window right
map ctrl+alt+up       neighboring_window up
map ctrl+alt+down     neighboring_window down
